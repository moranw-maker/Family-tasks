
name: Build FamilyTasks APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore project debug signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Restoring signing key from GitHub Actions Secret (ANDROID_DEBUG_KEYSTORE_BASE64)..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Restoring fallback signing key from repository (debug.keystore.base64)..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ -f debug.keystore ]; then
            echo "Using existing workspace debug.keystore..."
          else
            echo "::error::No signing keystore provided! Configure the ANDROID_DEBUG_KEYSTORE_BASE64 secret in GitHub repository settings."
            exit 1
          fi

          if [ ! -s debug.keystore ]; then
            echo "::error::debug.keystore is empty or failed to decode."
            exit 1
          fi

          echo "=== Configured Keystore Certificate Fingerprints ==="
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E "Alias name:|SHA1:|SHA256:"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and print final APK certificate fingerprints
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Built APK not found in app/build/outputs/apk/debug/!"
            exit 1
          fi
          echo "=== Final APK Signing Verification ($APK_PATH) ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyTasks-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
